[project]
name = "so101_pai"
version = "0.1.0"
description = "SO-101 real2sim / sim2real pipeline for the Physical AI final project"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["so101_pai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ROS 2 Jazzy's system pytest plugins are incompatible with the venv's newer pytest.
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint -p no:ament_lint"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
